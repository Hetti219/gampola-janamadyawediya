server {
    listen 80;
    server_name localhost;

    root /var/www/html;
    index index.php;

    client_max_body_size 200M;

    # Tailwind UI prototype as the site homepage. Exact match on "/" only —
    # WordPress still serves /wp-admin/, posts, pages, and all other routes
    # through the location / block below.
    location = / {
        root /var/www/ui;
        try_files /index.html =404;
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    location ~ \.php$ {
        fastcgi_pass wordpress:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_read_timeout 300;
        # Tell WordPress it's behind a proxy on port 8080 so
        # generated URLs use the right host:port.
        fastcgi_param HTTP_HOST localhost:8080;
    }

    location ~* \.(jpg|jpeg|png|gif|webp|mp4|webm|css|js|woff2)$ {
        expires 1h;
        add_header Cache-Control "public, no-transform";
    }

    location = /xmlrpc.php {
        deny all;
    }

    location ~* /wp-content/uploads/.*\.php$ {
        deny all;
    }
}
