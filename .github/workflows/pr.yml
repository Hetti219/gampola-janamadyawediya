name: PR Quality and Security Checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Lint, tests, PHPStan and compose validation all live in analysis.yml, which
  # the daily scheduled run calls too — so the PR gate and the daily run can
  # never come to check different things.
  lint:
    name: Lint, test & analysis
    uses: ./.github/workflows/analysis.yml

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # TruffleHog needs full history to scan the commits in the PR

      - name: TruffleHog OSS
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --debug --only-verified
