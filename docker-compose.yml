services:
  nginx:
    image: nginx:1.30.4-alpine
    container_name: news_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Production vhost (nginx/prod/wordpress.conf). The local-dev override
      # swaps this mount for nginx/local/.
      - ./nginx/prod:/etc/nginx/conf.d:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - wordpress_data:/var/www/html:ro
      # Nginx serves the theme's static files (CSS, images) directly, so it
      # needs the same theme bind mount the WordPress container has.
      - ./theme/gampola-janamadyawediya:/var/www/html/wp-content/themes/gampola-janamadyawediya:ro
      #AdSense ads.txt file
      - ./ads.txt:/var/www/html/ads.txt:ro
      # Monetag service worker. Must be reachable at the domain root — a
      # service worker's scope is capped at its own directory, and Monetag
      # needs the whole domain.
      #
      # Mounted under /etc/nginx and aliased into place by the vhost rather
      # than dropped straight into /var/www/html. That path is the read-only
      # wordpress_data volume, so runc cannot create a bind-mount target
      # inside it and the container refuses to start. (ads.txt gets away with
      # it only because the file already exists in the volume.)
      - ./sw.js:/etc/nginx/sw.js:ro
    
    depends_on:
      wordpress:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost/healthz -o /dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - news_net

  wordpress:
    image: wordpress:php8.5-fpm-alpine
    container_name: news_wordpress
    restart: unless-stopped
    environment:
      WORDPRESS_DB_HOST: mariadb
      WORDPRESS_DB_NAME: ${DB_NAME}
      WORDPRESS_DB_USER: ${DB_USER}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD}
      WORDPRESS_TABLE_PREFIX: wp_
      # Cloudflare cache-purge credentials (used by mu-plugins/cloudflare-purge.php).
      # No-ops gracefully when unset (local dev, initial setup).
      CF_ZONE_ID: ${CF_ZONE_ID:-}
      CF_API_TOKEN: ${CF_API_TOKEN:-}
      # Read by scripts/backfill-translations.php, which runs inside this
      # container. Must be its own key: docker-compose.override.yml replaces
      # WORDPRESS_CONFIG_EXTRA wholesale, so anything defined in there would
      # be dropped locally.
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      # WP_REDIS_HOST lets a Redis object-cache plugin (e.g. "Redis Object Cache")
      # find Redis automatically once you activate it from the plugin screen.
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_REDIS_HOST', 'redis');
        define('WP_MEMORY_LIMIT', '256M');
        define('FS_METHOD', 'direct');
        define('DISALLOW_FILE_EDIT', true);
        define('DISABLE_WP_CRON', true);
    volumes:
      - wordpress_data:/var/www/html
      - ./php/uploads.ini:/usr/local/etc/php/conf.d/uploads.ini:ro
      - ./php/opcache.ini:/usr/local/etc/php/conf.d/opcache.ini:ro
      # Compiles assert() out of the live site — see the file's own comments.
      - ./php/assertions.ini:/usr/local/etc/php/conf.d/assertions.ini:ro
      - ./mu-plugins:/var/www/html/wp-content/mu-plugins:ro
      - ./theme/gampola-janamadyawediya:/var/www/html/wp-content/themes/gampola-janamadyawediya:ro
      - ./ads.txt:/var/www/html/ads.txt:ro
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9000 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - news_net

  mariadb:
    image: mariadb:12.3
    container_name: news_mariadb
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      # Automatically run mariadb-upgrade on first start after major version bump.
      # Safe to leave permanently — it no-ops when already up to date.
      MARIADB_AUTO_UPGRADE: "1"
    volumes:
      - db_data:/var/lib/mysql
      - ./mariadb/conf.d:/etc/mysql/conf.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - news_net

  redis:
    image: redis:8-alpine
    container_name: news_redis
    restart: unless-stopped
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks:
      - news_net

volumes:
  wordpress_data:
  db_data:
  redis_data:

networks:
  news_net:
    driver: bridge
