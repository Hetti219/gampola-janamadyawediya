; Assertions are development and CI aids.
;
; The wordpress:php8.5-fpm-alpine image ships zend.assertions=1, which means
; every assert() in the theme and mu-plugins executes on the live site — and a
; failing one throws AssertionError and takes the whole request down. On a news
; site that is a white page for every reader, from a guard that exists to catch
; programming mistakes.
;
; -1 compiles assert() out entirely: zero cost in production, and no way for a
; diagnostic to become an outage. CI turns them back on explicitly
; (php -d zend.assertions=1 tests/run.php), and PHPStan reads the asserts as
; type narrowing either way, so the invariants are still checked before deploy.
zend.assertions = -1
