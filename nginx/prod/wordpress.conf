# --------------------------------------------------------------------------
# Gampola Janamadyawediya — production nginx config
# Replace example.com with your real domain everywhere in this file.
# --------------------------------------------------------------------------

# --- FastCGI cache zone (inside conf.d → included in the http{} block) ---
fastcgi_cache_path /var/cache/nginx/wp
    levels=1:2
    keys_zone=WP:32m
    max_size=200m
    inactive=60m;

# --- Cache bypass map ---
# Produces $skip_cache = 1 when the request must NOT be served from cache.
# Applied to both fastcgi_no_cache and fastcgi_cache_bypass.

map $request_method $skip_cache_method {
    default 0;
    POST    1;
}

map $http_cookie $skip_cache_cookie {
    default 0;
    ~wordpress_logged_in 1;
    ~comment_author      1;
    ~wp-postpass_        1;
}

map $request_uri $skip_cache_uri {
    default 0;
    ~*/wp-admin   1;
    ~*/wp-json    1;
    ~*/wp-login   1;
    ~*/wp-cron    1;
    ~*/xmlrpc.php 1;
    ~*/healthz    1;
}

map $arg_preview $skip_cache_preview {
    default 0;
    ~.      1;
}

map $arg_s $skip_cache_search {
    default 0;
    ~.      1;
}

# Combine all skip signals into one variable.
map "$skip_cache_method$skip_cache_cookie$skip_cache_uri$skip_cache_preview$skip_cache_search" $skip_cache {
    default 0;
    ~1      1;
}

# --- Gzip (Cloudflare does brotli at edge; origin gzip is free) ---
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 4;
gzip_min_length 256;
gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    application/xml
    application/rss+xml
    application/atom+xml
    image/svg+xml;

# --- HTTP → HTTPS redirect ---
server {
    listen 80;
    server_name gampolajanamadyawediya.com www.gampolajanamadyawediya.com;
    return 301 https://$host$request_uri;
}

# Catch-all for Host-header-less requests (container healthchecks)
server {
    listen 80 default_server;
    listen 443 ssl default_server;

    ssl_certificate     /etc/nginx/certs/cloudflare-origin.pem;
    ssl_certificate_key /etc/nginx/certs/cloudflare-origin.key;

    location = /healthz {
        fastcgi_pass wordpress:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/index.php;
        fastcgi_param QUERY_STRING ncg_healthz=1;
    }
    location / { return 444; }
}

# --- Main HTTPS server ---
server {
    listen 443 ssl;
    http2 on;
    server_name gampolajanamadyawediya.com www.gampolajanamadyawediya.com;

    ssl_certificate     /etc/nginx/certs/cloudflare-origin.pem;
    ssl_certificate_key /etc/nginx/certs/cloudflare-origin.key;

    root /var/www/html;
    index index.php;

    client_max_body_size 200M;

    # --- Security headers (server level — inherited by non-PHP locations) ---
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    # --- PHP with FastCGI cache ---
    location ~ \.php$ {
        fastcgi_pass wordpress:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_read_timeout 300;

        # Cache settings
        fastcgi_cache WP;
        fastcgi_cache_key "$scheme$request_method$host$request_uri";
        fastcgi_cache_valid 200 60s;
        fastcgi_cache_valid 301 302 10m;
        fastcgi_cache_valid 404 10s;
        fastcgi_cache_use_stale error timeout updating invalid_header http_500 http_503;
        fastcgi_cache_background_update on;
        fastcgi_cache_lock on;
        fastcgi_cache_lock_timeout 5s;

        # Bypass logic — skip caching for logged-in users, admin, etc.
        fastcgi_no_cache $skip_cache;
        fastcgi_cache_bypass $skip_cache;

        # Observability
        add_header X-FastCGI-Cache $upstream_cache_status always;

        # Vary header — belt-and-braces for intermediate proxies.
        # Cloudflare strips Vary for HTML at edge, so this only matters for
        # non-Cloudflare paths (direct origin access, outage, etc.).
        add_header Vary Cookie always;

        # Re-declare security headers inside this location — nginx's
        # add_header inheritance means the server-level headers are silently
        # dropped once any add_header appears in a location block.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # --- Static assets: browser/edge caching ---
    # These are served directly by nginx via try_files and never reach
    # PHP/fastcgi_cache. This adds proper expires + Cache-Control headers.
    location ~* \.(jpg|jpeg|png|gif|webp|avif|svg|ico|mp4|webm|css|js|woff|woff2|ttf|eot|pdf|webmanifest)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Block a common WordPress attack surface not needed for a single-author site.
    location = /xmlrpc.php {
        deny all;
    }

    # Block direct access to PHP files inside uploads (a common malware-upload trick).
    location ~* /wp-content/uploads/.*\.php$ {
        deny all;
    }
}
