# Replace example.com with your real domain everywhere in this file.

server {
    listen 80;
    server_name example.com www.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name example.com www.example.com;

    ssl_certificate     /etc/nginx/certs/cloudflare-origin.pem;
    ssl_certificate_key /etc/nginx/certs/cloudflare-origin.key;

    root /var/www/html;
    index index.php;

    client_max_body_size 200M;

    # --- Security headers ---
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    location ~ \.php$ {
        fastcgi_pass wordpress:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_read_timeout 300;
    }

    # Cache static assets and media at the edge/browser level.
    location ~* \.(jpg|jpeg|png|gif|webp|mp4|webm|css|js|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Block a common WordPress attack surface not needed for a single-author site.
    location = /xmlrpc.php {
        deny all;
    }

    # Block direct access to PHP files inside uploads (a common malware-upload trick).
    location ~* /wp-content/uploads/.*\.php$ {
        deny all;
    }
}
