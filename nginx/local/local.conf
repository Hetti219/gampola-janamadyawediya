# --------------------------------------------------------------------------
# Gampola Janamadyawediya — local development nginx config
# Mirrors the production caching setup (smaller cache zone) so
# HIT/BYPASS behavior can be verified on localhost:8080.
# --------------------------------------------------------------------------

# --- FastCGI cache zone (smaller for local dev) ---
fastcgi_cache_path /var/cache/nginx/wp
    levels=1:2
    keys_zone=WP:10m
    max_size=50m
    inactive=10m;

# --- Cache bypass map ---
map $request_method $skip_cache_method {
    default 0;
    POST    1;
}

map $http_cookie $skip_cache_cookie {
    default 0;
    ~wordpress_logged_in 1;
    ~comment_author      1;
    ~wp-postpass_        1;
}

map $request_uri $skip_cache_uri {
    default 0;
    ~*/wp-admin   1;
    ~*/wp-json    1;
    ~*/wp-login   1;
    ~*/wp-cron    1;
    ~*/xmlrpc.php 1;
    ~*/healthz    1;
}

map $arg_preview $skip_cache_preview {
    default 0;
    ~.      1;
}

map $arg_s $skip_cache_search {
    default 0;
    ~.      1;
}

map "$skip_cache_method$skip_cache_cookie$skip_cache_uri$skip_cache_preview$skip_cache_search" $skip_cache {
    default 0;
    ~1      1;
}

# --- Gzip ---
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 4;
gzip_min_length 256;
gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    application/xml
    application/rss+xml
    application/atom+xml
    image/svg+xml;

server {
    listen 80;
    server_name localhost;

    root /var/www/html;
    index index.php;

    client_max_body_size 200M;

    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    # --- PHP with FastCGI cache ---
    location ~ \.php$ {
        fastcgi_pass wordpress:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_read_timeout 300;
        # Tell WordPress it's behind a proxy on port 8080 so
        # generated URLs use the right host:port.
        fastcgi_param HTTP_HOST localhost:8080;

        # Cache settings
        fastcgi_cache WP;
        fastcgi_cache_key "$scheme$request_method$host$request_uri";
        fastcgi_cache_valid 200 60s;
        fastcgi_cache_valid 301 302 10m;
        fastcgi_cache_valid 404 10s;
        fastcgi_cache_use_stale error timeout updating invalid_header http_500 http_502 http_503;
        fastcgi_cache_background_update on;
        fastcgi_cache_lock on;
        fastcgi_cache_lock_timeout 5s;

        # Bypass logic
        fastcgi_no_cache $skip_cache;
        fastcgi_cache_bypass $skip_cache;

        # Observability
        add_header X-FastCGI-Cache $upstream_cache_status always;
        add_header Vary Cookie always;
    }

    # --- Static assets ---
    location ~* \.(jpg|jpeg|png|gif|webp|avif|svg|ico|mp4|webm|css|js|woff|woff2|ttf|eot|pdf|webmanifest)$ {
        expires 1h;
        add_header Cache-Control "public, no-transform";
    }

    location = /xmlrpc.php {
        deny all;
    }

    location ~* /wp-content/uploads/.*\.php$ {
        deny all;
    }
}
