name: Deploy to production

on:
  push:
    branches: [main]
  workflow_dispatch:        # manual re-deploy button in the Actions tab

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false   # let the running deploy finish; queue the new one

jobs:
  # Same shared definition as pr.yml and the daily run (analysis.yml). Keep the
  # job id "lint" — the deploy job below depends on it by name.
  lint:
    name: Lint, test & analysis
    uses: ./.github/workflows/analysis.yml

  deploy:
    name: Deploy
    needs: lint
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7

      - name: Deploy via SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
        run: |
          if [ -z "$SSH_HOST" ] || [ -z "$SSH_KEY" ]; then
            echo "::warning::Deploy secrets not configured yet — skipping deploy."
            echo "::warning::Add SSH_HOST/SSH_USER/SSH_KEY secrets (CI_CD_PIPELINE.md §7)."
            exit 0
          fi
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh -i ~/.ssh/deploy_key \
              -o StrictHostKeyChecking=accept-new \
              -o ConnectTimeout=15 \
              "$SSH_USER@$SSH_HOST" 'bash -s' < scripts/deploy-site.sh
